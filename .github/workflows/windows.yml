name: Windows kurulum dosyası (Setup.exe)

# Windows derlemesi uzun sürdüğü için her commit'te değil, commit mesajında [exe] geçince ya da elle çalışır.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-exe:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[exe]')
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python pyyaml rapidfuzz PySide6-Essentials ctranslate2 sentencepiece windows-capture sounddevice edge-tts miniaudio anthropic requests segno "paramiko>=3.4,<5" cryptography pyinstaller pillow pyclipper shapely six pytest
          # rapidocr CPU onnxruntime'ı çekmesin; yerine her ekran kartında çalışan DirectML sürümü
          pip install --no-deps rapidocr_onnxruntime
          pip install onnxruntime-directml
          # ctranslate2'nin GPU'da çevirmesi için NVIDIA cuBLAS
          pip install nvidia-cublas-cu12

      - name: Çeviri modeli önbelleği
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/opus-mt-en-tr
          key: opus-mt-tc-big-en-tr-ct2-int8f16-v1

      - name: Çeviri modelini indir ve dönüştür
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python tools/model_indir.py

      - name: İngilizce OCR modeli
        run: python tools/ocr_model_indir.py

      - name: adb (TV kurulumu için)
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip tools -Force
          Remove-Item pt.zip

      # Yerleşik Remote Play (chiaki penceresi olmadan PS5): couchsubs_native.dll = libchiaki + FFmpeg, MSYS2 ile
      # statik derlenir (CouchSubs'ın windows.yml'si gibi). native/ değişmedikçe önbellekten gelir.
      - name: Remote Play kütüphanesi önbelleği
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native/bin/couchsubs_native.dll
          key: native-win-${{ hashFiles('native/*.c', 'native/*.h', 'native/CMakeLists.txt', 'native/CHIAKI_COMMIT', 'native/patches/*') }}

      - name: chiaki-ng kaynakları
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git config --global core.autocrlf false
          bash native/fetch-chiaki.sh

      - uses: msys2/setup-msys2@v2
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          msystem: mingw64
          update: true
          install: make diffutils tar xz
          pacboy: >-
            cc:p
            cmake:p
            ninja:p
            pkgconf:p
            nasm:p
            python:p
            python-protobuf:p
            protobuf:p
            openssl:p
            json-c:p
            libevent:p
            miniupnpc:p

      - name: Remote Play kütüphanesi (libchiaki + FFmpeg)
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -e
          PREFIX="$PWD/ffmpeg-prefix"
          mkdir -p ffmpeg-src
          if curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz"; then
            tar -xJf ffmpeg.tar.xz -C ffmpeg-src --strip-components=1
          else
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o ffmpeg.tar.gz "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.2.tar.gz"
            tar -xzf ffmpeg.tar.gz -C ffmpeg-src --strip-components=1
          fi
          (cd ffmpeg-src && ./configure --prefix="$PREFIX" --enable-static --disable-shared --disable-debug \
            --disable-everything --disable-autodetect --enable-w32threads --disable-programs --disable-doc \
            --disable-network --disable-avdevice --disable-avformat --disable-avfilter --disable-swresample \
            --enable-avcodec --enable-avutil --enable-swscale --enable-decoder=h264 --enable-parser=h264 >/dev/null \
            && make -j"$(nproc)" >/dev/null && make install >/dev/null)
          cmake -S native -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DFFMPEG_PREFIX="$PREFIX"
          cmake --build build/native
          build/native/couchsubs_native_test.exe native/fixtures/sample-1080p.h264
          DLL=build/native/couchsubs_native.dll
          objdump -p "$DLL" | grep 'DLL Name' | tee deps.txt
          allowed='^(kernel32|user32|advapi32|shell32|ole32|oleaut32|gdi32|ws2_32|wsock32|iphlpapi|bcrypt|bcryptprimitives|crypt32|secur32|normaliz|msvcrt|ntdll|api-ms-win-.*|ucrtbase|dbghelp)\.dll$'
          bad=$(awk '{print tolower($3)}' deps.txt | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then echo "İzin verilmeyen bağımlılık: $bad"; exit 1; fi
          mkdir -p native/bin && cp "$DLL" native/bin/
          ls -l native/bin

      - name: Testler
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_remoteplay.py tests/test_detector.py tests/test_pipeline.py tests/test_server.py tests/test_ui.py tests/test_tekkopya.py tests/test_yeni_arayuz.py tests/test_sihirbaz_nino.py tests/test_ocr_vision.py tests/test_sahne_izleyici.py tests/test_kalite_zincir.py tests/test_bulanik_cevirmen.py tests/test_seslendirme.py tests/test_yardimci.py

      - name: TV kurulum testleri (Windows'ta)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_adb_native.py tests/test_samsung_direct.py tests/test_harcama.py tests/test_packs.py tests/test_updater.py tests/test_winutil.py -rs

      - name: İkon ve kurulum görselleri
        run: python packaging/make_assets.py

      - name: Samsung TV paket klasörü
        run: python tools/tv_web_hazirla.py

      - name: Hazır çeviri paketleri (kuruluma gömülür)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force paketler | Out-Null
          gh release download paketler -p "*.json.gz" -D paketler --clobber
          if ($LASTEXITCODE -ne 0) {
            Write-Host "paketler sürümü yok; doğrudan kaynaklardan alınıyor"
            python tools/paket_aynasi.py paketler
          }
          Remove-Item paketler\pool-*.json.gz -ErrorAction SilentlyContinue
          Get-ChildItem paketler | Format-Table Name, Length
          $global:LASTEXITCODE = 0

      - name: Uygulamayı paketle (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/gta6altyazi.spec

      - name: Paketlenen uygulama açılıyor mu
        env:
          QT_QPA_PLATFORM: offscreen
          ALTYAZI_DATA: ${{ runner.temp }}\altyazi-test
        run: |
          $p = Start-Process dist\GTA6Altyazi\GTA6Altyazi.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Get-Content "$env:ALTYAZI_DATA\altyazi.log" -ErrorAction SilentlyContinue; throw "Uygulama kapandı (kod $($p.ExitCode))" }
          Stop-Process $p
          Get-Content "$env:ALTYAZI_DATA\altyazi.log"

      - name: Kurulum sihirbazı (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = python -c "import altyazi; print(altyazi.__version__)"
          & $iscc /DAppVersion=$v packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup hatası" }
          Get-Item dist\GTA6Altyazi-Setup.exe | Format-List Name, Length

      - name: Uçtan uca deneme (gerçek Windows - kurulum, güncelleme, çeviri, güvenlik duvarı)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import altyazi; print(altyazi.__version__)"
          # Kurulum dosyası olan en son önceki sürüm (bir sürümün Windows derlemesi yayınlanmamış olabilir)
          $old = ""
          $prev = ""
          foreach ($tag in (gh release list --limit 30 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -like 'v*' -and $_.tagName -ne "v$v" }).tagName) {
            gh release download $tag -p GTA6Altyazi-Setup.exe -D eski --clobber 2>$null
            if ($LASTEXITCODE -eq 0) { $old = "eski\GTA6Altyazi-Setup.exe"; $prev = $tag; break }
          }
          $global:LASTEXITCODE = 0
          Write-Host "Önceki sürüm: $prev"
          python tools/e2e_windows.py dist\GTA6Altyazi-Setup.exe $old
          if ($LASTEXITCODE -ne 0) { throw "Uçtan uca deneme başarısız: kurulum dosyası yayınlanmadı" }

      - name: Sürümler sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = python -c "import altyazi; print(altyazi.__version__)"
          $tag = "v$v"
          $sha = "${{ github.sha }}".Substring(0, 7)
          python tools/surum_notu.py $v notlar.md $sha
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "${{ github.sha }}" --prerelease --title "GTA6 Altyazı $v" --notes-file notlar.md
          } else {
            gh release edit $tag --notes-file notlar.md
          }
          gh release upload $tag dist\GTA6Altyazi-Setup.exe --clobber
