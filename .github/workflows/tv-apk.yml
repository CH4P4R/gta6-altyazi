name: TV uygulamaları (Android APK + LG ipk)

on:
  push:
    paths:
      - 'tv-android/**'
      - '!tv-android/release/**'
      - 'tv-web/**'
      - '!tv-web/release/**'
      - '.github/workflows/tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: İmza anahtarı (GitHub Secrets)
        id: anahtar
        env:
          TV_KEYSTORE_B64: ${{ secrets.TV_KEYSTORE_B64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$TV_KEYSTORE_B64" ] || [ -z "$TV_KEYSTORE_PASSWORD" ]; then
            echo "::warning::TV_KEYSTORE_B64 ve TV_KEYSTORE_PASSWORD secret'ları eksik (Settings > Secrets and variables > Actions); Android APK bu sefer derlenmedi, LG paketi derleniyor"
            echo "var=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$TV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tv.jks"
          echo "var=1" >> "$GITHUB_OUTPUT"
      - name: APK derle
        if: steps.anahtar.outputs.var == '1'
        working-directory: tv-android
        env:
          TV_KEYSTORE_FILE: ${{ runner.temp }}/tv.jks
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleSideloadRelease testSideloadReleaseUnitTest
      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f "$RUNNER_TEMP/tv.jks"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: LG paketi (ipk, LG'nin resmi ares-package aracıyla)
        run: |
          pip install pillow
          npm install -g @webos-tools/cli
          python3 tools/tv_web_hazirla.py
          mkdir -p tv-web/release
          rm -f tv-web/release/*.ipk
          ares-package tv-web/build/webos -o tv-web/release
          ls -la tv-web/release
      - name: Paketleri depoya koy
        run: |
          if [ "${{ steps.anahtar.outputs.var }}" = "1" ]; then
            cp tv-android/app/build/outputs/apk/sideload/release/app-sideload-release.apk tv-android/release/gta6-altyazi-tv.apk
            grep -oP "versionCode \K\d+" tv-android/app/build.gradle > tv-android/release/gta6-altyazi-tv.version
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv-android/release tv-web/release
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "TV paketleri derlendi (${GITHUB_SHA::7})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
