name: macOS uygulaması (.dmg)

# Windows derlemesiyle aynı: commit mesajında [exe] geçince ya da elle çalışır. Yalnız Apple Silicon (M1 ve sonrası).
# İmza ve Apple onayı (notarization) için GitHub Secrets: MAC_CERT_P12_B64, MAC_CERT_PASSWORD, APPLE_ID,
# APPLE_TEAM_ID, APPLE_APP_PASSWORD. Yoksa imzasız (yerel imzalı) derlenir; ilk açılışta sağ tık › Aç gerekir.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[exe]')
    runs-on: macos-latest      # Apple Silicon (arm64)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python pyyaml rapidfuzz PySide6-Essentials ctranslate2 sentencepiece sounddevice edge-tts miniaudio anthropic requests segno "paramiko>=3.4,<5" cryptography pyinstaller pillow pyclipper shapely six pytest
          pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-Vision pyobjc-framework-ScreenCaptureKit pyobjc-framework-CoreMedia pyobjc-framework-ApplicationServices pyobjc-framework-libdispatch
          pip install --no-deps rapidocr_onnxruntime
          pip install onnxruntime

      - name: Çeviri modeli önbelleği
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models/opus-mt-en-tr
          key: mac-opus-mt-tc-big-en-tr-ct2-v1

      - name: Çeviri modelini indir ve dönüştür
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: python tools/model_indir.py

      - name: İngilizce OCR modeli
        run: python tools/ocr_model_indir.py

      - name: adb (TV kurulumu için, yedek yol)
        run: |
          curl -sSfL -o pt.zip https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          unzip -qo pt.zip -d tools
          rm pt.zip

      # Yerleşik Remote Play (chiaki penceresi olmadan PS5): couchsubs_native.dylib (libchiaki + FFmpeg, macOS 13+).
      - name: Remote Play kütüphanesi önbelleği
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native/bin/couchsubs_native.dylib
          key: native-mac-${{ hashFiles('native/*.c', 'native/*.h', 'native/CMakeLists.txt', 'native/CHIAKI_COMMIT', 'native/patches/*', 'native/build-mac.sh') }}

      - name: Remote Play bağımlılıkları önbelleği (OpenSSL, FFmpeg... kaynaktan)
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            native/build/mac-work/prefix
            native/build/mac-work/.done-*
          key: native-mac-deps-${{ hashFiles('native/build-mac.sh') }}

      - name: Remote Play kütüphanesi (libchiaki + FFmpeg)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list protobuf >/dev/null 2>&1 || brew install protobuf
          bash native/fetch-chiaki.sh
          bash native/build-mac.sh

      - name: Testler
        timeout-minutes: 35
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --durations=15 tests/test_yeni_arayuz.py tests/test_oyun_metni.py tests/test_turkce_metin.py tests/test_sihirbaz_nino.py tests/test_ocr_vision.py tests/test_sahne_izleyici.py tests/test_kalite_zincir.py tests/test_bulanik_cevirmen.py tests/test_seslendirme.py tests/test_yardimci.py tests/test_remoteplay.py tests/test_detector.py tests/test_pipeline.py tests/test_server.py tests/test_ui.py tests/test_tekkopya.py tests/test_adb_native.py tests/test_samsung_direct.py tests/test_updater.py tests/test_harcama.py tests/test_tv_brands.py tests/test_auto.py

      - name: macOS platform denemesi (pencere listesi, Quartz, kısayol ayrıştırma)
        run: |
          python - <<'PY'
          from altyazi import winutil, macutil
          from altyazi.hotkeys import Hotkeys
          wins = winutil.list_windows()
          print("pencereler:", wins[:5])
          print("ekran kaydı izni:", macutil.screen_capture_allowed())
          print("kısayol:", Hotkeys.parse_mac("ctrl+shift+9"))
          import ScreenCaptureKit, CoreMedia, Quartz, AppKit  # paketlenecek modüller yükleniyor mu
          print("pyobjc tamam")
          PY

      - name: Apple Vision yazı tanıma (gerçek Mac'te okuma ve hız)
        run: |
          python - <<'PY'
          import time, cv2, numpy as np
          from altyazi import ocr_vision
          from altyazi.config import OcrCfg
          from altyazi.ocr import make_recognizer
          from altyazi.fullscreen import FullScreenReader
          assert ocr_vision.available(), "Vision yüklenemedi"
          print("otomatik seçim:", make_recognizer(OcrCfg()).device)   # CI sanal Mac'inde Neural Engine yok, yavaş olabilir
          rec = make_recognizer(OcrCfg(motor="vision"))
          print("tanıyıcı:", rec.device)
          assert "Vision" in rec.device and "doğru" in rec.device, rec.device
          def line(text):
              img = np.full((56, 1100, 3), 255, np.uint8)
              cv2.putText(img, text, (10, 40), cv2.FONT_HERSHEY_DUPLEX, 1.25, (0, 0, 0), 2)
              return img
          a, b = "You said this would be easy, Lucia.", "I never said that. Get in the car!"
          t = time.perf_counter(); out = rec.recognize([line(a), line(b)]); ms = (time.perf_counter() - t) * 1000
          print(f"iki satır: {ms:.0f} ms ->", [(o.text, o.score) for o in out])
          assert "lucia" in out[0].text.lower() and out[1].text.lower().startswith("i never") and "car" in out[1].text.lower(), out
          frame = np.full((1080, 1920, 3), 40, np.uint8)
          cv2.putText(frame, "BUY FLOWERS FOR LUCIA", (1300, 300), cv2.FONT_HERSHEY_DUPLEX, 1.4, (255, 255, 255), 2)
          cv2.putText(frame, "Meet me at the docks tonight", (200, 900), cv2.FONT_HERSHEY_DUPLEX, 1.4, (255, 255, 255), 2)
          fs = FullScreenReader(min_score=0.5)
          t = time.perf_counter(); lines = fs.read_lines(frame); ms = (time.perf_counter() - t) * 1000
          print(f"tam ekran: {ms:.0f} ms ->", lines)
          texts = " | ".join(t for t, _ in lines).lower()
          assert fs.vision and "flowers" in texts and "docks" in texts, lines
          box = next(b for t, b in lines if "docks" in t.lower())
          assert 150 < box[0] < 260 and 850 < box[1] < 920, box          # koordinatlar piksel ve doğru yönde
          print("Apple Vision tamam")
          PY

      - name: Simge, TV paketleri, hazır paketler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/make_assets.py
          python tools/tv_web_hazirla.py
          mkdir -p paketler
          gh release download paketler -p "*.json.gz" -D paketler --clobber || python tools/paket_aynasi.py paketler
          rm -f paketler/pool-*.json.gz

      - name: Uygulamayı paketle (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/gta6altyazi.spec

      - name: İmza (Developer ID; yoksa yerel imza)
        env:
          MAC_CERT_P12_B64: ${{ secrets.MAC_CERT_P12_B64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          APP="dist/GTA6 Altyazı.app"
          if [ -n "$MAC_CERT_P12_B64" ] && [ -n "$MAC_CERT_PASSWORD" ]; then
            KC="$RUNNER_TEMP/imza.keychain-db"; KCP=$(uuidgen)
            echo "$MAC_CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/imza.p12"
            security create-keychain -p "$KCP" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCP" "$KC"
            security import "$RUNNER_TEMP/imza.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
            security set-key-partition-list -S apple-tool:,apple: -k "$KCP" "$KC"
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            rm -f "$RUNNER_TEMP/imza.p12"
            ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
            echo "İmza: $ID"
            echo "MAC_SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::MAC_CERT_P12_B64 / MAC_CERT_PASSWORD yok: uygulama yerel imzayla derleniyor (ilk açılışta sağ tık › Aç gerekir)"
            ID="-"
          fi
          OPTS=(--force --timestamp --options runtime --entitlements packaging/mac.entitlements --sign "$ID")
          [ "$ID" = "-" ] && OPTS=(--force --sign -)
          # içten dışa: önce bütün kütüphaneler ve programlar, en son paket
          find "$APP/Contents" -type f \( -name "*.dylib" -o -name "*.so" -o -perm -u+x \) -print0 | while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then codesign "${OPTS[@]}" "$f" >/dev/null 2>&1 || echo "imzalanamadı: $f"; fi
          done
          codesign "${OPTS[@]}" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Disk görüntüsü (.dmg)
        run: |
          mkdir -p dmg
          cp -R "dist/GTA6 Altyazı.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "GTA6 Altyazı" -srcfolder dmg -ov -format UDZO dist/GTA6Altyazi-mac.dmg
          ls -la dist/GTA6Altyazi-mac.dmg

      - name: Apple onayı (notarization)
        if: env.MAC_SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "::warning::APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD yok: imzalı ama Apple onaysız"; exit 0
          fi
          xcrun notarytool submit dist/GTA6Altyazi-mac.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --timeout 60m
          xcrun stapler staple dist/GTA6Altyazi-mac.dmg
          spctl -a -t open --context context:primary-signature -vv dist/GTA6Altyazi-mac.dmg || true

      - name: Uçtan uca deneme (gerçek Mac - açılış, çeviri, TV akışı, güncelleme)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import altyazi; print(altyazi.__version__)")
          old=""
          # .dmg'si olan en son önceki sürüm
          for prev in $(gh release list --limit 30 --json tagName -q '.[].tagName' | grep '^v' | grep -v "^v$v$"); do
            if gh release download "$prev" -p GTA6Altyazi-mac.dmg -D eski --clobber 2>/dev/null; then old="eski/GTA6Altyazi-mac.dmg"; break; fi
          done
          echo "Önceki Mac sürümü: ${old:-yok}"
          python tools/e2e_mac.py dist/GTA6Altyazi-mac.dmg "$old"

      - name: Sürümler sayfasına koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python -c "import altyazi; print(altyazi.__version__)")
          tag="v$v"
          for i in 1 2 3 4 5 6; do
            if gh release view "$tag" >/dev/null 2>&1; then break; fi
            python tools/surum_notu.py "$v" notlar.md "${GITHUB_SHA::7}"
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "GTA6 Altyazı $v" --notes-file notlar.md && break
            sleep 30
          done
          gh release upload "$tag" dist/GTA6Altyazi-mac.dmg --clobber

      - name: Anahtar zincirini sil
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/imza.keychain-db" 2>/dev/null || true
