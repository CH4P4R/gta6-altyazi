<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="ortak.css">
<style>
  .harita { position: absolute; inset: 0; }
  .gorev { position: absolute; left: 22px; width: 330px; background: rgba(12,12,18,.9); color: #fff; border-radius: 6px; overflow: hidden;
    box-shadow: 0 14px 30px rgba(0,0,0,.45); }
  .gorev .serit { display: flex; height: 6px; }
  .gorev .serit i:first-child { flex: 0 0 64%; background: #d7263d; }
  .gorev .serit i:last-child { flex: 1; background: #fff; }
  .gorev .ic { padding: 12px 16px 14px; }
  .gorev h5 { font-weight: 900; font-size: 19px; letter-spacing: 1.4px; text-transform: uppercase; }
  .gorev p { margin-top: 6px; font-size: 14px; line-height: 1.35; color: #d8dbe4; }
  .g1 { top: 22px; }
  .g2 { top: 152px; box-shadow: 0 14px 30px rgba(0,0,0,.45), 0 0 0 2px rgba(255,255,255,.85); }
  .g2 .tr { position: absolute; right: 12px; top: 15px; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.12); padding: 3px 8px 3px 4px; border-radius: 999px; }
  .g2 .tr img { width: 18px; height: 18px; }
  .ok { position: absolute; left: 44px; top: 124px; width: 2px; height: 20px; border-left: 2px dashed rgba(255,255,255,.8); }
  .ok::after { content: ""; position: absolute; left: -7px; bottom: -2px; border: 6px solid transparent; border-top: 8px solid rgba(255,255,255,.9); }
</style></head>
<body>
<script src="ortak.js"></script>
<script>
function harita() {
  const r = rastgele(5);
  let s = `<svg width="700" height="318" viewBox="0 0 700 318">
    <rect width="700" height="318" fill="#3f7fae"/>
    <path d="M150 0 L700 0 L700 318 L330 318 C300 280 250 270 240 230 C230 190 270 170 250 130 C230 90 170 80 150 0Z" fill="#e3e3d6"/>
    <path d="M520 318 C540 270 600 250 700 260 L700 318Z" fill="#3f7fae"/>
    <path d="M470 40 C520 30 560 60 600 50 L620 110 C580 120 520 110 480 100Z" fill="#bcd8a6"/>
    <path d="M300 250 C330 230 380 240 400 270 L380 300 C350 300 320 290 300 250Z" fill="#bcd8a6"/>`;
  for (let i = 0; i < 70; i++) {                       // bina blokları
    const x = 260 + r() * 440, y = r() * 318, w = 12 + r() * 22, h = 10 + r() * 18;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="#d1d1c3"/>`;
  }
  s += `<path d="M180 0 C230 80 300 120 330 200 S420 300 470 318" stroke="#f1a33a" stroke-width="7" fill="none"/>
    <path d="M330 0 L360 318 M420 0 L450 318 M520 0 L540 318 M620 0 L630 318" stroke="#fff" stroke-width="4"/>
    <path d="M240 60 L700 30 M260 150 L700 140 M300 230 L700 210" stroke="#fff" stroke-width="4"/>
    <path d="M390 190 C430 170 470 150 560 120" stroke="#ff4d8d" stroke-width="5" fill="none" stroke-dasharray="2 0" stroke-linecap="round"/>
    <g transform="translate(390 190) rotate(62)"><path d="M0 -14 L11 12 L0 6 L-11 12Z" fill="#1f6fe5" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></g>
    <circle cx="560" cy="120" r="13" fill="#ffd34d" stroke="#111" stroke-width="2"/>
    <text x="560" y="125" text-anchor="middle" font-family="Inter" font-weight="900" font-size="15" fill="#111">$</text>
    <circle cx="640" cy="250" r="9" fill="#37b36b" stroke="#111" stroke-width="2"/>
    <circle cx="470" cy="80" r="9" fill="#4aa3ff" stroke="#111" stroke-width="2"/>
    <rect x="600" y="286" width="84" height="20" rx="4" fill="rgba(0,0,0,.55)"/>
    <text x="642" y="300" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#fff">1.2 mi</text>
  </svg>`;
  return s;
}
kart({
  baslik: "Harita görevleri Türkçe.",
  alt: "Görev kartlarını anında Türkçe oku.",
  sehir: { tohum: 77, gunesX: 0.6 },
  oyunArka: false,
  ui: `<div class="harita">${harita()}</div>
  <div class="gorev g1"><div class="serit"><i></i><i></i></div><div class="ic"><h5>Earn Money</h5>
    <p>Bring in some money by any means necessary.</p></div></div>
  <div class="ok"></div>
  <div class="gorev g2"><div class="serit"><i></i><i></i></div><div class="ic"><h5>Para Kazan</h5>
    <p>Ne yapıp edip biraz para getir.</p></div>
    <div class="tr"><img src="${MARKA}simge_yazisiz.png">Türkçe</div></div>`
});
</script>
</body></html>
