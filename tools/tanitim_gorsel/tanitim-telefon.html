<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="ortak.css">
<style>
  .kahraman .yazi { width: 420px; }
  .alinti { position: absolute; right: 26px; top: 46px; width: 222px; padding: 18px 18px 20px; background: #fff; border-radius: 18px;
    transform: rotate(2.5deg); box-shadow: 0 18px 36px rgba(20,0,40,.45); }
  .alinti q { quotes: "“" "”"; display: block; font-weight: 900; font-size: 23px; line-height: 1.15; letter-spacing: -0.4px; color: #0f1a33; }
  .alinti .kim { margin-top: 10px; font-size: 13px; color: #6a5bd6; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .alinti .kim i { width: 8px; height: 8px; border-radius: 50%; background: #34c759; display: block; }
  .kahraman .mini { position: absolute; right: 30px; bottom: 14px; width: 96px; height: 96px; filter: drop-shadow(0 10px 18px rgba(20,0,40,.5)); }

  .tel .ekran { background: #f2f3f7; }
  .bas { display: flex; align-items: center; gap: 9px; padding: 6px 12px 9px; background: #fff; border-bottom: 1px solid #e3e5ec; }
  .av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg,#ff9a5a,#d6457f); color: #fff;
    font-weight: 900; font-size: 14px; display: grid; place-items: center; }
  .bas .ad { font-weight: 900; font-size: 14px; }
  .bas small { display: block; font-size: 10px; color: #34a853; }
  .akis { padding: 9px 10px; display: flex; flex-direction: column; gap: 7px; }
  .bal { max-width: 82%; padding: 7px 10px; border-radius: 14px; font-size: 12px; line-height: 1.25; }
  .o { align-self: flex-start; background: #fff; color: #111; border-bottom-left-radius: 4px; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
  .ben { align-self: flex-end; background: #2f7cf6; color: #fff; border-bottom-right-radius: 4px; }

  .panel { left: 318px; right: 16px; top: 16px; bottom: 16px; padding: 14px 16px; }
  .panel .pb { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 15px; color: #0f1a33; }
  .panel .pb span { margin-left: auto; font-size: 11px; font-weight: 700; color: #fff; background: #e30a17; padding: 3px 8px; border-radius: 999px; }
  .panel .akis { padding: 10px 0 0; gap: 8px; }
  .panel .bal { font-size: 15px; font-weight: 700; padding: 8px 12px; max-width: 86%; }
  .panel .o { background: #fff; box-shadow: 0 2px 6px rgba(15,26,51,.10); }
  .panel .son { outline: 2px solid #6a5bd6; outline-offset: 2px; }
</style></head>
<body>
<script src="ortak.js"></script>
<script>
kart({
  baslik: "Oyundaki telefon artık Türkçe.",
  alt: "Konuşmayı oyundaki sırayla Türkçe oku.",
  sehir: { tohum: 3, gunesX: 0.78 },
  sag: `<div class="alinti"><q>Ama teslimat bana, Marco'ya değil.</q><div class="kim"><i></i>Ramon · Türkçesi</div></div>
        <img class="mini" src="${MARKA}bot.png">`,
  ui: `
  <div class="tel"><div class="ekran">
    <div class="durum"><span>21:48</span><b></b><span class="pil"></span></div>
    <div class="bas"><div class="av">R</div><div><div class="ad">Ramon</div><small>online</small></div></div>
    <div class="akis">
      <div class="bal o">Package lands tonight at the marina.</div>
      <div class="bal ben">Who's picking it up?</div>
      <div class="bal o">You. Bring it straight to me.</div>
      <div class="bal o">But the delivery comes to me, not Marco.</div>
    </div>
  </div></div>
  <div class="panel">
    <div class="pb"><div class="av" style="width:26px;height:26px;font-size:12px">R</div>Ramon<span>Türkçe</span></div>
    <div class="akis">
      <div class="bal o">Paket bu gece marinaya geliyor.</div>
      <div class="bal ben">Kim alacak?</div>
      <div class="bal o">Sen. Doğrudan bana getir.</div>
      <div class="bal o son">Ama teslimat bana, Marco'ya değil.</div>
    </div>
    <div class="imza"><img src="${MARKA}simge_yazisiz.png">GTA6 Altyazı</div>
  </div>`
});
</script>
</body></html>
