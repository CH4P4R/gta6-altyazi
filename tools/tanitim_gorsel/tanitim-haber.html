<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="ortak.css">
<style>
  .tel .ekran { background: #fbf8f2; }
  .gaz { padding: 4px 13px 0; }
  .gaz .mast { font-family: Georgia, "DejaVu Serif", serif; font-weight: 700; font-size: 17px; text-align: center; letter-spacing: -0.2px;
    border-bottom: 2px solid #1b1b1b; padding-bottom: 5px; }
  .gaz .tarih { display: flex; justify-content: space-between; font-size: 8.5px; color: #6b6458; padding: 3px 0 0; text-transform: uppercase; letter-spacing: .6px; }
  .gaz .etiket { margin-top: 7px; display: inline-block; background: #b3202a; color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .8px; padding: 2px 6px; border-radius: 3px; }
  .gaz h4 { margin-top: 5px; font-family: Georgia, "DejaVu Serif", serif; font-weight: 700; font-size: 17.5px; line-height: 1.12; color: #141414; }
  .gaz .resim { margin-top: 7px; height: 50px; border-radius: 8px; overflow: hidden; }
  .gaz p { margin-top: 7px; font-family: Georgia, "DejaVu Serif", serif; font-weight: 400; font-size: 11px; line-height: 1.35; color: #3b3832; }
  .ui .panel { left: 318px; right: 16px; padding: 14px 18px; }
  .p1 { top: 16px; height: 112px; }
  .p2 { top: 140px; bottom: 16px; }
  .panel .etk { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #b3202a; display: flex; align-items: center; gap: 6px; }
  .panel .etk i { width: 7px; height: 7px; border-radius: 50%; background: #b3202a; display: block; }
  .panel h3 { margin-top: 8px; font-weight: 900; font-size: 25px; line-height: 1.1; letter-spacing: -0.5px; color: #1d1028; }
  .panel p { margin-top: 8px; font-size: 16px; line-height: 1.38; color: #3f3150; }
</style></head>
<body>
<script src="ortak.js"></script>
<script>
const bataklik = `<svg width="206" height="50" viewBox="0 10 206 50" preserveAspectRatio="xMidYMid slice">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b37a"/><stop offset="1" stop-color="#e46e7d"/></linearGradient></defs>
  <rect width="206" height="66" fill="url(#bg)"/><circle cx="150" cy="40" r="16" fill="#ffe0a0"/>
  <rect y="40" width="206" height="26" fill="#5d6b4a"/><rect y="46" width="206" height="20" fill="#3f5a5a"/>
  <path d="M40 52 q20 -8 46 -4 q14 2 22 -2 l12 2 q-6 5 -14 5 q-30 6 -66 -1z" fill="#24331f"/>
  <circle cx="105" cy="46" r="1.6" fill="#ffe0a0"/>
  <path d="M0 40 q10 -24 6 -38 M14 40 q-4 -20 4 -34 M190 40 q6 -18 2 -30 M200 40 q-6 -14 0 -26" stroke="#2b3a26" stroke-width="2.5" fill="none"/></svg>`;
kart({
  baslik: "Oyun içi haberler Türkçe.",
  alt: "Gazete manşetleri ve yazılar Türkçe.",
  sehir: { tohum: 57, gunesX: 0.74 },
  sag: `<img class="simge" src="${MARKA}simge_yazisiz.png">`,
  ui: `
  <div class="tel"><div class="ekran">
    <div class="durum"><span>10:05</span><b></b><span class="pil"></span></div>
    <div class="gaz">
      <div class="mast">The Coastline Journal</div>
      <div class="tarih"><span>Tuesday</span><span>Local News</span></div>
      <div class="etiket">BREAKING</div>
      <h4>Drug sniffing gator has a stroke</h4>
      <div class="resim">${bataklik}</div>
      <p>Officials say Sgt. Chomps, the county's star narcotics alligator, collapsed during a sweep at the docks.</p>
    </div>
  </div></div>
  <div class="panel p1"><div class="etk"><i></i>Manşet</div><h3>Uyuşturucu arayan timsah felç geçirdi</h3></div>
  <div class="panel p2"><div class="etk"><i></i>Haber</div>
    <p>Yetkililere göre ilçenin yıldız narkotik timsahı Çavuş Chomps, limanda yapılan arama sırasında yığılıp kaldı.</p>
    <div class="imza"><img src="${MARKA}simge_yazisiz.png">GTA6 Altyazı</div></div>`
});
</script>
</body></html>
