<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<link rel="stylesheet" href="ortak.css">
<style>
  :root { --vurgu: #ff2d7a; }
  .harita { height: 66px; background: #e9edf2; position: relative; }
  .harita svg { display: block; }
  .ic { padding: 8px 13px 0; }
  .ic h3 { font-weight: 900; font-size: 16px; letter-spacing: -0.2px; display: inline-block; }
  .satir { margin-top: 8px; display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 12px;
    border: 1.5px solid var(--vurgu); background: #fff1f6; }
  .satir .ar { width: 30px; height: 20px; border-radius: 6px; background: var(--vurgu); position: relative; }
  .satir .ar::after { content: ""; position: absolute; left: 5px; right: 5px; top: 4px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.8); }
  .satir .ad { font-size: 13.5px; font-weight: 700; display: inline-block; }
  .satir small { display: block; font-size: 10px; color: #7a8193; }
  .satir .fiyat { margin-left: auto; font-weight: 900; font-size: 13px; }
  .ucret { margin-top: 9px; display: flex; justify-content: space-between; font-size: 13px; color: #4a5164; }
  .ucret span:first-child { display: inline-block; }
  .ucret b { color: #111; }
  .dugme { margin-top: 9px; background: var(--vurgu); color: #fff; text-align: center; font-weight: 700; font-size: 14px;
    padding: 9px 0; border-radius: 12px; }
  .baglanti { margin-top: 8px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--vurgu); }
  .baglanti span { display: inline-block; }
</style></head>
<body>
<script src="ortak.js"></script>
<script>
kart({
  baslik: "Aracını<br>Türkçe çağır.",
  alt: "Sürüş uygulamasının her düğmesi Türkçe.",
  sehir: { tohum: 12, gunesX: 0.7 },
  ui: `
  <div class="tel"><div class="ekran">
    <div class="durum"><span>21:48</span><b></b><span class="pil"></span></div>
    <div class="harita"><svg width="218" height="66" viewBox="0 6 200 66" preserveAspectRatio="xMidYMid slice">
      <rect width="200" height="78" fill="#e6ebf1"/>
      <path d="M0 58 L200 40" stroke="#fff" stroke-width="7"/><path d="M60 0 L84 78" stroke="#fff" stroke-width="6"/>
      <path d="M140 0 L128 78" stroke="#fff" stroke-width="5"/><rect x="150" y="50" width="50" height="28" fill="#cfe7d4"/>
      <path d="M30 63 C60 56 70 30 96 32 S140 20 166 16" stroke="#ff2d7a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="30" cy="63" r="6" fill="#111"/><circle cx="30" cy="63" r="2.5" fill="#fff"/>
      <circle cx="166" cy="16" r="6" fill="#ff2d7a"/><circle cx="166" cy="16" r="2.5" fill="#fff"/></svg></div>
    <div class="ic">
      <h3 data-tr="Araç Seç">Choose Ride</h3>
      <div class="satir"><div class="ar"></div><div><div class="ad" data-tr="Standart Araç">Standard Ride</div><small>4 min · 3 seats</small></div><div class="fiyat">$82</div></div>
      <div class="ucret"><span data-tr="Ücret">Cost</span><b>$82.00</b></div>
      <div class="dugme" data-tr="Araç Çağır ($82)">Book Ride ($82)</div>
      <div class="baglanti"><span data-tr="Hedefi Değiştir">Change Destination</span></div>
    </div>
  </div></div>`
});
window.hazir = () => cipler("#ff2d7a");
</script>
</body></html>
