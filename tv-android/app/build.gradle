plugins { id 'com.android.application' }

android {
    namespace 'com.gta6altyazi.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.gta6altyazi.tv'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '0.3.1'
    }
    // İmza anahtarı repoda durmaz: GitHub Actions onu Secrets'tan (TV_KEYSTORE_B64 / TV_KEYSTORE_PASSWORD)
    // geçici bir dosyaya açar ve buraya ortam değişkenleriyle verir. Anahtar yoksa (yerel deneme derlemesi)
    // Android'in hata ayıklama anahtarıyla imzalanır.
    def ksFile = System.getenv('TV_KEYSTORE_FILE')
    signingConfigs {
        sabit {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('TV_KEYSTORE_PASSWORD')
                keyAlias 'gta6altyazi'
                keyPassword System.getenv('TV_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.sabit : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
